name: 관측 스냅샷 수집

# CrowdSense의 공개 API를 10분마다 호출해 스냅샷을 적재한다.
# GitHub 예약 실행은 최선 노력이라 부하가 걸리면 몇 분 밀릴 수 있는데,
# 수집기가 관측 시각으로 중복을 걸러내므로 밀려도 데이터가 오염되지는 않는다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 실행이 겹치면 같은 브랜치에 동시에 push하게 되므로 직렬화한다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 스냅샷 수집
        env:
          BASE: https://crowdsense-jvv1.vercel.app
        run: node collect.mjs

      - name: 커밋·푸시
        run: |
          # 원본 갱신 주기(5분)보다 자주 돌므로 변경이 없는 실행이 흔하다
          if [ -z "$(git status --porcelain)" ]; then
            echo "중복 관측 — 커밋 생략"
            exit 0
          fi
          git config user.name  "crowdsense-collector"
          git config user.email "actions@github.com"
          git add backtest
          git commit -m "data: 스냅샷 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # 동시 실행이 겹쳤을 때를 대비해 재시도
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "푸시 실패" && exit 1
